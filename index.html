<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#2c2858;--bg2:#363270;--bg3:#403c82;
  --border:#504a98;--border2:#6560b0;
  --text:#d0c4ff;--muted:#9080c8;--dim:#6058a0;
  --orange:#ffbda0;--blue:#a8d8ff;--purple:#d4b8ff;
  --cyan:#96f0e4;--green:#a0f0c0;--red:#ffacc8;--yellow:#ffe8a0;
  --mono:'DM Mono',monospace;
  --radius:18px;--radius-sm:12px;
}
html,body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, #4a3890 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, #28407a 0%, transparent 60%);
  color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overscroll-behavior:none
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{
  -webkit-appearance:none;appearance:none;font-family:var(--mono);outline:none;
  color:var(--text);background:rgba(255,255,255,.05);
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:15px;width:100%;backdrop-filter:blur(4px)
}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{
  -webkit-box-shadow:0 0 0 30px #403c82 inset!important;
  -webkit-text-fill-color:#d0c4ff!important;caret-color:#d0c4ff!important;
  border:1px solid var(--border2)!important
}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:.4}
textarea{resize:vertical}
#app{max-width:600px;margin:0 auto;padding-bottom:80px}

/* Header */
.hdr{padding:20px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.hdr-title{font-size:19px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#c39aff,#7ec8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-right{display:flex;align-items:center;gap:10px}

/* Day nav */
.day-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border)}
.nav-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:6px 16px;font-size:16px;transition:background .15s}
.nav-btn:disabled{opacity:.25;cursor:default}
.day-label{text-align:center}
.day-name{font-size:16px;font-weight:700}
.day-date{font-size:12px;color:var(--muted)}

/* Tab bar */
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:rgba(9,7,26,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.tab-btn{flex:1;padding:12px 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:none;background:none;border-bottom:2px solid transparent;color:var(--muted);transition:color .2s}

/* Panes */
.pane{display:none;padding:16px 16px 0}
.pane.on{display:block}

/* Badges */
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block;letter-spacing:.02em}

/* Routine bar */
.edit-banner{background:rgba(255,157,108,.1);border:1px solid rgba(255,157,108,.3);border-radius:var(--radius-sm);padding:8px 14px;margin-bottom:14px;font-size:12px;color:var(--orange);text-align:center}
.routine-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:14px}
.sw-btn{background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:20px;color:var(--muted);font-size:12px;padding:5px 14px;transition:background .15s}

/* Volume bar */
.vol-bar{border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.vol-val{font-size:24px;font-weight:800;font-family:var(--mono)}
.vol-meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.6}

/* Exercise cards */
.ex-card{
  background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.02) 100%);
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;
  overflow:hidden;transition:border-color .2s,box-shadow .2s;
  backdrop-filter:blur(8px)
}
.ex-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.ex-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-meta{font-size:12px;color:var(--muted);margin-top:3px}
.ex-acts{display:flex;gap:4px;align-items:center;margin-left:8px;flex-shrink:0}
.ico{color:var(--muted);font-size:16px;padding:2px 6px;line-height:1}
.pr-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px}
.ex-body{padding:0 16px 14px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.set-num{color:var(--dim);font-size:11px;width:20px}
.set-val{font-weight:600;font-family:var(--mono)}
.inp-row{display:flex;gap:8px;margin-top:12px}
.inp-row input{text-align:center}
.add-btn{background:var(--border2);color:var(--muted);border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:700;font-size:13px;white-space:nowrap;transition:all .15s}
.last-ban{background:rgba(255,255,255,.04);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--dim);margin-top:8px}
.add-ex-btn{width:100%;background:rgba(255,255,255,.03);border:1px dashed var(--border2);border-radius:var(--radius);padding:13px;color:var(--muted);font-size:13px;margin-bottom:10px;transition:background .15s}

/* Bike */
.bike-card{background:linear-gradient(135deg,rgba(110,240,222,.06),rgba(255,255,255,.02));border:1px solid rgba(110,240,222,.2);border-radius:var(--radius);padding:18px;margin-top:4px}
.bike-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bike-stats{display:flex;justify-content:space-around;background:rgba(255,255,255,.05);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.bike-stat-val{font-size:20px;font-weight:800;color:var(--cyan);font-family:var(--mono)}
.bike-stat-lab{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase}
.flab{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:5px}

/* History */
.hist-card{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.hist-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hist-date{font-size:14px;font-weight:700}
.hist-meta{font-size:11px;color:var(--muted);margin-top:2px}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12px}
.hist-skip{font-size:11px;color:var(--dim);font-style:italic;margin-top:4px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-h{font-size:16px;font-weight:700;color:var(--muted)}

/* Progress */
.pt-toggle{display:flex;gap:8px;margin-bottom:18px}
.pt-btn{flex:1;padding:11px;border-radius:var(--radius);font-weight:700;font-size:13px;border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--muted);transition:all .2s}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat-card{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-val{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat-lab{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:3px}
.sort-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sort-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-size:12px;font-weight:600;transition:all .2s}
.prog-sess{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.prog-hd{border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.prog-ex{padding:8px 16px;border-top:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;font-size:12px}
.prog-skip{padding:4px 16px 10px;font-size:11px;color:var(--dim);font-style:italic}
.avg-sec{background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:10px}
.avg-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px;letter-spacing:.06em}
.avg-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12px}
.unlock-ban{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--muted);text-align:center}
.total-mi{background:rgba(110,240,222,.07);border:1px solid rgba(110,240,222,.2);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}

/* Backup */
.bk-panel{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.bk-btn{border-radius:var(--radius-sm);padding:8px 16px;font-size:13px;font-weight:600;margin-right:8px;margin-bottom:6px}

/* PR toast */
#pr-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1a1020,#0e0a20);border:1px solid var(--yellow);border-radius:var(--radius);padding:14px 22px;z-index:200;display:none;align-items:center;gap:14px;box-shadow:0 0 40px rgba(255,217,108,.25),0 8px 32px rgba(0,0,0,.6);animation:fadeIn .3s ease}
#pr-toast.on{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Swap modal */
#swap-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end}
#swap-modal.on{display:flex}
.swap-panel{background:linear-gradient(180deg,#1a1535,#110e2a);border-top:1px solid var(--border2);border-radius:22px 22px 0 0;width:100%;max-height:82vh;display:flex;flex-direction:column}
.swap-hdr{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.swap-list{overflow-y:auto;flex:1}
.grp-hdr{padding:7px 18px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;background:rgba(255,255,255,.03);letter-spacing:.07em}
.ex-lb{display:block;width:100%;padding:13px 18px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text);text-align:left;font-size:14px;font-family:'DM Sans',sans-serif;transition:background .1s}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="pr-toast">
    <span style="font-size:28px">🏆</span>
    <div>
      <div style="font-size:15px;font-weight:800;color:var(--yellow)">NEW PR!</div>
      <div id="pr-sub" style="font-size:12px;color:var(--text);margin-top:2px"></div>
    </div>
  </div>
  <div id="hdr"></div>
  <div id="bk-panel"></div>
  <div id="day-nav"></div>
  <div id="tab-bar"></div>
  <div id="pane-today"  class="pane"></div>
  <div id="pane-hist"   class="pane"></div>
  <div id="pane-prog"   class="pane"></div>
</div>
<div id="swap-modal">
  <div class="swap-panel">
    <div class="swap-hdr">
      <div id="swap-title" style="font-weight:700;font-size:15px">Swap Exercise</div>
      <button class="ico" style="font-size:22px" onclick="closeSwap()">×</button>
    </div>
    <div style="padding:12px 18px">
      <input id="swap-inp" placeholder="Search exercises…" oninput="filterSwap(this.value)">
    </div>
    <div class="swap-list" id="swap-list"></div>
  </div>
</div>
<script>

const LIBRARY={

  "Deadlift":["Conventional Deadlift","Sumo Deadlift","Romanian Deadlift","Trap Bar Deadlift","Rack Pull","Deficit Deadlift","Snatch-Grip Deadlift","Stiff-Leg Deadlift"],

};
const ALL_EX=[...new Set(Object.values(LIBRARY).flat())];

// ─── ROUTINES & SCHEDULE ──────────────────────────────────────────────────────
const DEFAULT_ROUTINES={
  push:{label:"Workout A",color:"#ffbda0",exercises:["Bench Press","Incline Dumbbell Press","Low to High Cable Fly","Tricep Pushdown","Overhead Tricep Extension","Plank","Ab Wheel"]},
  pull:{label:"Workout B",color:"#a8d8ff",exercises:["Incline Bench Press","Low to High Cable Fly","High to Low Cable Fly","Dumbbell Pullover","Hammer Curl","Incline Curl","Hanging Leg Raise","Cable Crunch"]},
  legs:{label:"Workout C",color:"#d4b8ff",exercises:["Dumbbell Bench Press","High to Low Cable Fly","Decline Bench Press","Push-Ups","Skull Crushers","Close-Grip Bench Press","Russian Twist","Dead Bug","Plank"]}

  "Front Raises":"3×15","Cable Front Raises":"3×15","Rear Delt Flyes":"3×15-20",

  "Turkish Get-Up":"3×5","Battle Ropes":"3×30s","Sled Push":"4×20m",
  "Sled Pull":"4×20m","Box Jumps":"4×8","Broad Jump":"4×6","Burpees":"3×10",
  "Jump Rope":"3×60s","Bear Crawl":"3×20m","Med Ball Slam":"3×12",
  "Wall Ball":"3×15","Tire Flip":"4×8","Prowler Push":"4×20m",
  // Machines
  "Chest Press Machine":"3×12-15","Pec Deck":"3×15","Shoulder Press Machine":"3×12-15",
  "Lat Pulldown Machine":"3×12-15","Seated Row Machine":"3×12-15","Leg Press Machine":"3×12-15",
  "Leg Curl Machine":"3×15","Leg Extension Machine":"3×15","Hip Abductor Machine":"3×15-20",
  "Hip Adductor Machine":"3×15-20","Calf Raise Machine":"4×15-20","Hack Squat Machine":"3×10-12",
  "Assisted Pull-Up Machine":"3×10-12","Functional Trainer":"3×12-15",
  "Smith Machine Squat":"3×10-12","Smith Machine Bench":"3×10-12",
  "Back Extension Machine":"3×15","Glute Machine":"3×15"
};
const DAY_SCHEDULE={1:["push"],2:["bike"],3:["pull"],4:["bike"],5:["legs"],6:["bike"]};
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const STORE="wt_hist_v1", RSTORE="wt_rout_v1";

// ─── STATE ────────────────────────────────────────────────────────────────────
const state={
  tab:"today", viewDate:"", routineKey:"push",
  logged:[], history:{}, routines:{...DEFAULT_ROUTINES},
  openIdx:null, draftW:"", draftR:"",
  bikeDist:"", bikeTime:"", bikeNote:"",
  swapIdx:null,
  saveDot:"idle", showBackup:false, importMsg:{text:"",color:""},
  progressType:"lift", progressSort:"newest",
  prTimer:null, saveTimer:null
};

// ─── UTILS ────────────────────────────────────────────────────────────────────
const todayISO=()=>new Date().toISOString().split("T")[0];
const dowOf=iso=>new Date(iso+"T12:00:00").getDay();
const fmtDate=iso=>new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtDur=m=>{const n=parseInt(m)||0;return n>=60?`${Math.floor(n/60)}h ${n%60}m`:`${n}m`;};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const dbGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const dbSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const accent=()=>state.routineKey==="bike"?"#96f0e4":(state.routines[state.routineKey]?.color||"#ffbda0");

function hexRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function updateTheme(){
  const ac=accent(),root=document.documentElement;
  root.style.setProperty('--text',ac);
  root.style.setProperty('--muted',hexRgba(ac,.55));
  root.style.setProperty('--dim',hexRgba(ac,.3));
}

function groupSets(sets){
  if(!sets?.length)return"";
  const m={};
  sets.forEach(s=>{m[s.weight]=(m[s.weight]||0)+1;});
  return Object.entries(m).sort(([a],[b])=>parseFloat(b)-parseFloat(a)).map(([w,n])=>`${n}×${w}lb`).join(", ");
}
function sessVol(sess){
  return(sess.exercises||[]).reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0),0);
}
function todayVol(){return state.logged.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0),0);}
function getMaxWeight(exName,skipDate=null){
  let max=0;
  Object.entries(state.history).forEach(([d,sess])=>{
    if(d===skipDate)return;
    (sess.exercises||[]).filter(e=>e.name===exName).forEach(e=>e.sets.forEach(s=>{const w=parseFloat(s.weight)||0;if(w>max)max=w;}));
  });
  return max;
}
function getAvgWeight(exName){
  let total=0,count=0;
  Object.values(state.history).forEach(sess=>(sess.exercises||[]).filter(e=>e.name===exName).forEach(e=>e.sets.forEach(s=>{const w=parseFloat(s.weight)||0;if(w>0){total+=w;count++;}})));
  return count>0?(total/count).toFixed(1):null;
}
function hasPRToday(ex){
  if(!ex.sets.length)return false;
  const todayMax=Math.max(...ex.sets.map(s=>parseFloat(s.weight)||0));
  const prev=getMaxWeight(ex.name,state.viewDate);
  return prev>0&&todayMax>prev;
}
function lastExData(exName){
  return Object.entries(state.history)
    .filter(([d,sess])=>d<state.viewDate&&(sess.exercises||[]).some(e=>e.name===exName))
    .sort(([a],[b])=>b.localeCompare(a))
    .map(([date,sess])=>({date,sets:sess.exercises.find(e=>e.name===exName)?.sets||[]}))[0]||null;
}
function lastBike(){
  return Object.entries(state.history).filter(([d,s])=>d<state.viewDate&&s.type==="bike"&&s.distance).sort(([a],[b])=>b.localeCompare(a))[0]||null;
}
function liftSessions(){
  return Object.entries(state.history)
    .filter(([,s])=>s.routineKey&&s.routineKey!=="bike"&&(s.exercises||[]).some(e=>e.sets.length>0))
    .map(([date,sess])=>({date,routineKey:sess.routineKey,label:state.routines[sess.routineKey]?.label||sess.routineKey,color:state.routines[sess.routineKey]?.color||"#f97316",exercises:sess.exercises||[],volume:sessVol(sess)}));
}
function sortedSessions(){
  const s=liftSessions();
  switch(state.progressSort){
    case"oldest":return s.sort((a,b)=>a.date.localeCompare(b.date));
    case"volume_high":return s.sort((a,b)=>b.volume-a.volume);
    case"volume_low":return s.sort((a,b)=>a.volume-b.volume);
    default:return s.sort((a,b)=>b.date.localeCompare(a.date));
  }
}
function bikeRides(){
  return Object.entries(state.history).filter(([,s])=>s.type==="bike"&&s.distance).sort(([a],[b])=>b.localeCompare(a))
    .map(([date,s])=>({date,distance:parseFloat(s.distance)||0,duration:parseInt(s.duration)||0,speed:s.duration?+((parseFloat(s.distance)||0)/((parseInt(s.duration)||1)/60)).toFixed(1):0,note:s.note||""}));
}

// ─── SAVE ─────────────────────────────────────────────────────────────────────
function save(hist){
  if(state.saveTimer)clearTimeout(state.saveTimer);
  setSaveDot("saving");
  state.saveTimer=setTimeout(()=>{
    try{dbSet(STORE,hist);setSaveDot("saved");setTimeout(()=>setSaveDot("idle"),2000);}
    catch{setSaveDot("error");}
  },300);
}
function setSaveDot(s){
  state.saveDot=s;
  const el=document.getElementById("save-dot");
  if(!el)return;
  const map={saving:["SAVING…","var(--orange)"],saved:["✓ SAVED","var(--green)"],error:["✗ FAILED","var(--red)"],idle:["","transparent"]};
  const[t,c]=map[s]||map.idle;
  el.textContent=t;el.style.color=c;
}

// ─── PR TOAST ─────────────────────────────────────────────────────────────────
function showPR(name,weight){
  if(state.prTimer)clearTimeout(state.prTimer);
  const el=document.getElementById("pr-toast");
  document.getElementById("pr-sub").textContent=`${name} — ${weight}lb`;
  el.classList.add("on");
  state.prTimer=setTimeout(()=>el.classList.remove("on"),4500);
}

// ─── DAY INIT ─────────────────────────────────────────────────────────────────
function initDay(date){
  const dow=dowOf(date),sched=DAY_SCHEDULE[dow]||[],defRk=sched.includes("bike")?"bike":(sched[0]||"push");
  const sess=state.history[date];
  state.viewDate=date;state.openIdx=null;state.draftW="";state.draftR="";
  if(sess){
    const rk=sess.routineKey||defRk;state.routineKey=rk;
    if(rk==="bike"){state.bikeDist=sess.distance||"";state.bikeTime=sess.duration||"";state.bikeNote=sess.note||"";state.logged=[];}
    else{state.logged=sess.exercises||[];state.bikeDist="";state.bikeTime="";state.bikeNote="";}
  }else{
    state.routineKey=defRk;
    if(defRk==="bike"){state.bikeDist="";state.bikeTime="";state.bikeNote="";state.logged=[];}
    else{
      state.logged=(state.routines[defRk]?.exercises||[]).map(n=>({name:n,sets:[]}));
      const h={...state.history,[date]:{routineKey:defRk,exercises:state.logged}};
      state.history=h;dbSet(STORE,h);
    }
  }
  renderAll();
}
function navDay(d){const dt=new Date(state.viewDate+"T12:00:00");dt.setDate(dt.getDate()+d);initDay(dt.toISOString().split("T")[0]);}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function setTab(t){state.tab=t;renderAll();}

function logSet(idx){
  const w=parseFloat(state.draftW),r=parseInt(state.draftR);
  if(!w||!r)return;
  const prev=getMaxWeight(state.logged[idx].name,state.viewDate);
  if(prev>0&&w>prev)showPR(state.logged[idx].name,w);
  state.logged=state.logged.map((ex,i)=>i!==idx?ex:{...ex,sets:[...ex.sets,{weight:w,reps:r}]});
  state.draftW="";state.draftR="";
  persistLogged(state.logged);
  renderToday();
}
function removeSet(ei,si){
  state.logged=state.logged.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.filter((_,j)=>j!==si)});
  persistLogged(state.logged);renderToday();
}
function persistLogged(log){
  const h={...state.history,[state.viewDate]:{routineKey:state.routineKey,exercises:log}};
  state.history=h;save(h);
}
function removeExercise(idx){
  state.logged=state.logged.filter((_,i)=>i!==idx);
  if(state.openIdx===idx)state.openIdx=null;
  persistLogged(state.logged);renderToday();
}
function toggleEx(idx){
  state.openIdx=state.openIdx===idx?null:idx;
  state.draftW="";state.draftR="";
  renderToday();
}
function switchRoutine(rk){
  state.routineKey=rk;state.openIdx=null;
  if(rk==="bike"){
    state.bikeDist="";state.bikeTime="";state.bikeNote="";state.logged=[];
    const h={...state.history,[state.viewDate]:{type:"bike",routineKey:"bike",distance:"",duration:"",note:""}};
    state.history=h;save(h);
  }else{
    state.logged=(state.routines[rk]?.exercises||[]).map(n=>({name:n,sets:[]}));
    const h={...state.history,[state.viewDate]:{routineKey:rk,exercises:state.logged}};
    state.history=h;save(h);
  }
  renderAll();
}
function saveBike(){
  const h={...state.history,[state.viewDate]:{type:"bike",routineKey:"bike",distance:state.bikeDist,duration:state.bikeTime,note:state.bikeNote}};
  state.history=h;save(h);
  renderTodayBikeStats();
}
function setBikeDist(v){state.bikeDist=v;saveBike();}
function setBikeTime(v){state.bikeTime=v;saveBike();}
function setBikeNote(v){state.bikeNote=v;saveBike();}

// ─── SWAP MODAL ───────────────────────────────────────────────────────────────
function openSwap(idx){
  state.swapIdx=idx;
  document.getElementById("swap-title").textContent=idx===-1?"Add Exercise":"Swap Exercise";
  document.getElementById("swap-inp").value="";
  document.getElementById("swap-modal").classList.add("on");
  filterSwap("");
  setTimeout(()=>document.getElementById("swap-inp").focus(),100);
}
function closeSwap(){
  state.swapIdx=null;
  document.getElementById("swap-modal").classList.remove("on");
}
function filterSwap(q){
  const list=document.getElementById("swap-list");
  if(!list)return;
  let html="";
  if(q.length>1){
    const filtered=ALL_EX.filter(e=>e.toLowerCase().includes(q.toLowerCase())).slice(0,40);
    filtered.forEach(ex=>{html+=`<button class="ex-lb" data-name="${esc(ex)}" onclick="confirmSwap(this.dataset.name)">${esc(ex)}</button>`;});
  }else{
    Object.entries(LIBRARY).forEach(([grp,exs])=>{
      html+=`<div class="grp-hdr">${esc(grp)}</div>`;
      exs.forEach(ex=>{html+=`<button class="ex-lb" data-name="${esc(ex)}" onclick="confirmSwap(this.dataset.name)">${esc(ex)}</button>`;});
    });
  }
  list.innerHTML=html;
}
function confirmSwap(name){
  if(state.swapIdx===-1){
    state.logged=[...state.logged,{name,sets:[]}];
  }else{
    state.logged=state.logged.map((ex,i)=>i!==state.swapIdx?ex:{name,sets:[]});
  }
  closeSwap();persistLogged(state.logged);renderToday();
}

// ─── BACKUP ───────────────────────────────────────────────────────────────────
function toggleBackup(){state.showBackup=!state.showBackup;renderBackup();}
function exportData(){return JSON.stringify({history:state.history,routines:state.routines,exported:new Date().toISOString()},null,2);}
function copyExport(){
  const txt=exportData();
  try{navigator.clipboard.writeText(txt);}catch{const el=document.createElement("textarea");el.value=txt;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);}
  state.importMsg={text:"✓ Copied to clipboard",color:"var(--green)"};renderBackup();
}
function importData(){
  const ta=document.getElementById("import-ta");
  try{
    const d=JSON.parse(ta.value||"");
    if(!d.history)throw new Error("Invalid format");
    state.history=d.history;
    if(d.routines)state.routines={...DEFAULT_ROUTINES,...d.routines};
    dbSet(STORE,state.history);dbSet(RSTORE,state.routines);
    state.importMsg={text:"✓ Imported successfully",color:"var(--green)"};
    renderAll();initDay(state.viewDate);
  }catch(e){state.importMsg={text:"✗ "+e.message,color:"var(--red)"};renderBackup();}
}
function setProgressType(t){state.progressType=t;renderProgress();}
function setProgressSort(s){state.progressSort=s;renderProgress();}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function badge(color,text){return`<span class="badge" style="background:${color}22;border:1px solid ${color}55;color:${color}">${esc(text)}</span>`;}

// ─── RENDER: HEADER ───────────────────────────────────────────────────────────
function renderHeader(){
  document.getElementById("hdr").innerHTML=`
    <div class="hdr">
      <div class="hdr-title">Workout Tracker</div>
      <div class="hdr-right">
        <span id="save-dot" style="font-size:11px;font-family:var(--mono)"></span>
        <button class="ico" style="font-size:18px" onclick="toggleBackup()">💾</button>
      </div>
    </div>`;
}

// ─── RENDER: BACKUP ───────────────────────────────────────────────────────────
function renderBackup(){
  const el=document.getElementById("bk-panel");
  if(!state.showBackup){el.innerHTML="";return;}
  el.innerHTML=`
    <div style="padding:0 18px">
      <div class="bk-panel">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">Backup & Restore</div>
        <button class="bk-btn" style="background:#22c55e22;border:1px solid #22c55e55;color:var(--green)" onclick="copyExport()">Export (Copy)</button>
        <textarea id="import-ta" placeholder="Paste backup JSON here to restore…" style="height:80px;font-size:12px;margin-top:10px;background:var(--bg3)"></textarea>
        <button class="bk-btn" style="background:#38bdf822;border:1px solid #38bdf855;color:var(--blue);margin-top:8px" onclick="importData()">Import</button>
        ${state.importMsg.text?`<div style="font-size:12px;color:${state.importMsg.color};margin-top:6px">${esc(state.importMsg.text)}</div>`:""}
      </div>
    </div>`;
}

// ─── RENDER: DAY NAV ──────────────────────────────────────────────────────────
function renderDayNav(){
  const ac=accent(),isToday=state.viewDate===todayISO();
  document.getElementById("day-nav").innerHTML=`
    <div class="day-nav">
      <button class="nav-btn" onclick="navDay(-1)">‹</button>
      <div class="day-label">
        <div class="day-name" style="color:${isToday?ac:"var(--text)"}">${isToday?"Today":DOW[dowOf(state.viewDate)]}</div>
        <div class="day-date">${fmtDate(state.viewDate)}</div>
      </div>
      <button class="nav-btn" onclick="navDay(1)" ${isToday?"disabled":""}>›</button>
    </div>`;
}

// ─── RENDER: TAB BAR ──────────────────────────────────────────────────────────
function renderTabBar(){
  const ac=accent();
  const tabs=[["today","Today"],["hist","History"],["prog","Progress"]];
  document.getElementById("tab-bar").innerHTML=`<div class="tab-bar">${tabs.map(([k,l])=>`<button class="tab-btn${state.tab===k?" active":""}" style="${state.tab===k?`color:${ac};border-bottom-color:${ac}`:""}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>`;
}

// ─── RENDER: TODAY ────────────────────────────────────────────────────────────
function renderToday(){
  const el=document.getElementById("pane-today");
  const ac=accent(),isToday=state.viewDate===todayISO();
  let html="";
  if(!isToday)html+=`<div class="edit-banner">✏️ Editing ${DOW[dowOf(state.viewDate)]}, ${fmtDate(state.viewDate)}</div>`;

  // Routine bar
  const switchBtns=Object.keys(state.routines).filter(k=>k!==state.routineKey).map(k=>`<button class="sw-btn" onclick="switchRoutine('${k}')">${esc(state.routines[k].label)} →</button>`).join("")
    +(state.routineKey!=="bike"?`<button class="sw-btn" onclick="switchRoutine('bike')">🚲 Bike →</button>`:"");
  html+=`<div class="routine-bar">${badge(ac,state.routineKey==="bike"?"🚲 Bike Ride":(state.routines[state.routineKey]?.label||"Workout"))}<div style="display:flex;gap:6px;flex-wrap:wrap">${switchBtns}</div></div>`;

  if(state.routineKey==="bike"){
    html+=renderBike(ac);
  }else{
    // Volume bar
    const vol=todayVol();
    if(vol>0){
      html+=`<div class="vol-bar" style="background:var(--bg2);border:1px solid ${ac}33">
        <div><div style="font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:2px">Today's Volume</div>
        <div class="vol-val" style="color:${ac}">${vol.toLocaleString()} lb</div></div>
        <div class="vol-meta">${state.logged.reduce((a,e)=>a+e.sets.length,0)} sets<br>${state.logged.filter(e=>e.sets.length>0).length} exercises</div>
      </div>`;
    }
    // Exercise cards
    state.logged.forEach((ex,idx)=>{
      const isOpen=state.openIdx===idx,isPR=hasPRToday(ex),last=lastExData(ex.name);
      const borderCol=isOpen?ac:isPR?"var(--yellow)":"var(--border)";
      html+=`<div class="ex-card" style="border-color:${borderCol}">
        <div class="ex-hdr" onclick="toggleEx(${idx})">
          <div style="flex:1;min-width:0">
            <div class="ex-title" style="color:${ac}">${esc(ex.name)}${isPR?`<span class="pr-badge" style="background:${ac}22;border:1px solid ${ac};color:${ac}">🏆 PR</span>`:""}</div>
            <div class="ex-meta">${ex.sets.length>0?esc(groupSets(ex.sets)):last?`Last: ${esc(groupSets(last.sets))} · ${fmtDate(last.date)}`:"No previous data"}${RECS[ex.name]?` <span style="color:var(--dim);font-size:11px">· ${esc(RECS[ex.name])}</span>`:""}</div>
          </div>
          <div class="ex-acts">
            <button class="ico" onclick="event.stopPropagation();openSwap(${idx})" title="Swap">⇄</button>
            <button class="ico" onclick="event.stopPropagation();removeExercise(${idx})" title="Remove">×</button>
            <span class="ico" style="font-size:11px">${isOpen?"▲":"▼"}</span>
          </div>
        </div>`;
      if(isOpen){
        html+=`<div class="ex-body">`;
        ex.sets.forEach((s,si)=>{
          html+=`<div class="set-row">
            <span class="set-num">${si+1}</span>
            <span class="set-val" style="color:${ac}">${s.weight}lb × ${s.reps}</span>
            <button class="ico" onclick="removeSet(${idx},${si})">×</button>
          </div>`;
        });
        html+=`<div class="inp-row">
          <input type="number" inputmode="decimal" placeholder="lbs" value="${esc(state.draftW)}" oninput="state.draftW=this.value">
          <input type="number" inputmode="numeric" placeholder="reps" value="${esc(state.draftR)}" oninput="state.draftR=this.value">
          <button class="add-btn${(state.draftW&&state.draftR)?" ready":""}" style="${(state.draftW&&state.draftR)?`background:${ac};color:#000`:""}" onclick="logSet(${idx})">+ Set</button>
        </div>`;
        if(last)html+=`<div class="last-ban">Last: ${esc(groupSets(last.sets))}</div>`;
        html+=`</div>`;
      }
      html+=`</div>`;
    });
    html+=`<button class="add-ex-btn" onclick="openSwap(-1)">+ Add Exercise</button>`;
  }
  el.innerHTML=html;
}

function renderBike(ac){
  const lb=lastBike();
  let html="";
  if(lb)html+=`<div class="last-ban" style="margin-bottom:10px">🚲 Last ride: <strong>${fmtDate(lb[0])}</strong> — ${lb[1].distance}mi in ${fmtDur(lb[1].duration)}</div>`;
  html+=`<div class="bike-card">
    <div style="font-size:13px;font-weight:700;color:var(--cyan);margin-bottom:14px">Ride Log</div>
    <div class="bike-grid">
      <div><div class="flab">DISTANCE (mi)</div><input type="number" inputmode="decimal" placeholder="12.5" value="${esc(state.bikeDist)}" oninput="state.bikeDist=this.value;saveBike()"></div>
      <div><div class="flab">TIME (min)</div><input type="number" inputmode="numeric" placeholder="45" value="${esc(state.bikeTime)}" oninput="state.bikeTime=this.value;saveBike()"></div>
    </div>
    <div id="bike-stats-inner">${bikeStatsHTML()}</div>
    <input placeholder="Note (optional)" value="${esc(state.bikeNote)}" oninput="state.bikeNote=this.value;saveBike()" style="text-align:left;margin-top:4px">
  </div>`;
  return html;
}
function bikeStatsHTML(){
  if(!state.bikeDist||!state.bikeTime)return"";
  const spd=((parseFloat(state.bikeDist)||0)/((parseInt(state.bikeTime)||1)/60)).toFixed(1);
  return`<div class="bike-stats">
    ${[["⏱",fmtDur(state.bikeTime),"TIME"],["📍",`${state.bikeDist}mi`,"DIST"],["⚡",`${spd}mph`,"SPEED"]].map(([i,v,l])=>`<div class="bike-stat"><div style="font-size:10px;color:var(--muted)">${i}</div><div class="bike-stat-val">${v}</div><div class="bike-stat-lab">${l}</div></div>`).join("")}
  </div>`;
}
function renderTodayBikeStats(){
  const el=document.getElementById("bike-stats-inner");
  if(el)el.innerHTML=bikeStatsHTML();
}

// ─── RENDER: HISTORY ──────────────────────────────────────────────────────────
function renderHistory(){
  const el=document.getElementById("pane-hist");
  const entries=Object.entries(state.history).filter(([d])=>d<=state.viewDate).sort(([a],[b])=>b.localeCompare(a));
  if(!entries.length){el.innerHTML=`<div class="empty"><div class="empty-ico">📋</div><div class="empty-h">No sessions yet</div></div>`;return;}
  let html="";
  entries.forEach(([date,sess])=>{
    const isBk=sess.type==="bike",rk=sess.routineKey||"push";
    const rout=isBk?{label:"Bike Ride",color:"#22d3ee"}:(state.routines[rk]||state.routines.push);
    const exs=sess.exercises||[],sets=exs.reduce((a,e)=>a+e.sets.length,0);
    const vol=exs.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0),0);
    const isVD=date===state.viewDate,co=rout.color;
    html+=`<div class="hist-card" style="${isVD?`border-color:${co}55`:""}">
      <div class="hist-head">
        <div>
          <div class="hist-date" style="color:${isVD?co:"var(--text)"}">${fmtDate(date)}${isVD?" ←":""}</div>
          <div class="hist-meta">${isBk?`🚲 ${sess.distance}mi · ${fmtDur(sess.duration)} · ${((parseFloat(sess.distance)||0)/((parseInt(sess.duration)||1)/60)).toFixed(1)}mph`:`${sets} sets · ${vol.toLocaleString()}lb`}</div>
        </div>
        ${badge(co,isBk?"🚲 Bike":rout.label)}
      </div>`;
    if(!isBk){
      exs.filter(e=>e.sets.length>0).forEach(ex=>{html+=`<div class="hist-row"><span style="color:var(--text);font-weight:600">${esc(ex.name)}</span><span style="color:${co}cc;font-family:var(--mono);font-size:11px">${esc(groupSets(ex.sets))}</span></div>`;});
      const skipped=exs.filter(e=>e.sets.length===0);
      if(skipped.length)html+=`<div class="hist-skip">Skipped: ${skipped.map(e=>esc(e.name)).join(", ")}</div>`;
    }
    if(isBk&&sess.note)html+=`<div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">"${esc(sess.note)}"</div>`;
    html+=`</div>`;
  });
  el.innerHTML=html;
}

// ─── RENDER: PROGRESS ────────────────────────────────────────────────────────
function renderProgress(){
  const el=document.getElementById("pane-prog");
  const pt=state.progressType;
  let html=`<div class="pt-toggle">
    <button class="pt-btn" style="${pt==="lift"?"border-color:var(--orange);background:#f9731622;color:var(--orange)":""}" onclick="setProgressType('lift')">🏋️ Lift</button>
    <button class="pt-btn" style="${pt==="bike"?"border-color:var(--cyan);background:#22d3ee22;color:var(--cyan)":""}" onclick="setProgressType('bike')">🚲 Bike</button>
  </div>`;

  if(pt==="lift"){
    const sessions=liftSessions(),sorted=sortedSessions();
    // Summary stats
    if(sessions.length>0){
      const avgVol=Math.round(sessions.reduce((a,s)=>a+s.volume,0)/sessions.length);
      const prMap={};
      sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(set=>{const w=parseFloat(set.weight)||0;if(!prMap[e.name]||w>prMap[e.name])prMap[e.name]=w;})));
      const topPR=Object.entries(prMap).sort(([,a],[,b])=>b-a)[0];
      html+=`<div class="stats-grid">
        <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${sessions.length}</div><div class="stat-lab">Sessions</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--blue)">${avgVol.toLocaleString()}</div><div class="stat-lab">Avg Volume</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--yellow)">${topPR?`${topPR[1]}lb`:"—"}</div><div class="stat-lab">${topPR?esc(topPR[0].split(" ").slice(0,2).join(" ")):"Top PR"}</div></div>
      </div>`;
    }
    // Sort controls
    if(sessions.length>1){
      html+=`<div class="sort-row">
        ${[["newest","Newest"],["oldest","Oldest"],["volume_high","↑ Volume"],["volume_low","↓ Volume"]].map(([k,l])=>`<button class="sort-btn${state.progressSort===k?" active":""}" onclick="setProgressSort('${k}')">${l}</button>`).join("")}
      </div>`;
    }
    // Session list
    if(sorted.length===0){
      html+=`<div class="empty"><div class="empty-ico">🏋️</div><div class="empty-h">No lift sessions yet</div></div>`;
    }else{
      sorted.forEach(sess=>{
        html+=`<div class="prog-sess">
          <div class="prog-hd" style="background:${sess.color}11">
            <div>
              <div style="font-size:13px;font-weight:700">${fmtDate(sess.date)}</div>
              ${badge(sess.color,sess.label)}
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:700;color:${sess.color};font-family:var(--mono)">${sess.volume.toLocaleString()} lb</div>
              <div style="font-size:10px;color:var(--muted)">${sess.exercises.reduce((a,e)=>a+e.sets.length,0)} sets</div>
            </div>
          </div>`;
        sess.exercises.filter(e=>e.sets.length>0).forEach(ex=>{
          const todayMax=Math.max(...ex.sets.map(s=>parseFloat(s.weight)||0));
          const prev=getMaxWeight(ex.name,sess.date);
          const isPR=prev>0&&todayMax>prev;
          html+=`<div class="prog-ex">
            <span style="color:var(--text);font-weight:600">${esc(ex.name)}${isPR?" 🏆":""}</span>
            <span style="color:${sess.color}cc;font-family:var(--mono);font-size:11px">${esc(groupSets(ex.sets))}</span>
          </div>`;
        });
        const skipped=sess.exercises.filter(e=>e.sets.length===0);
        if(skipped.length)html+=`<div class="prog-skip">Skipped: ${skipped.map(e=>esc(e.name)).join(", ")}</div>`;
        html+=`</div>`;
      });
    }
    // Per-exercise averages
    if(sessions.length>=2){
      const exNames=[...new Set(sessions.flatMap(s=>s.exercises.filter(e=>e.sets.length>0).map(e=>e.name)))];
      html+=`<div class="avg-sec"><div class="avg-title">Exercise Averages</div>`;
      exNames.forEach(name=>{
        const avg=getAvgWeight(name),max=getMaxWeight(name);
        if(!avg)return;
        html+=`<div class="avg-row"><span style="color:var(--text);font-weight:600">${esc(name)}</span><span style="font-family:var(--mono);font-size:11px">avg ${avg}lb · max ${max}lb</span></div>`;
      });
      html+=`</div>`;
    }
  }else{
    // Bike progress
    const rides=bikeRides();
    if(rides.length>=3){
      const avgDist=(rides.reduce((a,r)=>a+r.distance,0)/rides.length).toFixed(1);
      const avgTime=Math.round(rides.reduce((a,r)=>a+r.duration,0)/rides.length);
      const avgSpeed=(rides.reduce((a,r)=>a+r.speed,0)/rides.length).toFixed(1);
      const totalMi=rides.reduce((a,r)=>a+r.distance,0).toFixed(1);
      html+=`<div class="stats-grid">
        <div class="stat-card"><div class="stat-val" style="color:var(--cyan)">${avgDist}</div><div class="stat-lab">Avg mi</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--purple)">${fmtDur(avgTime)}</div><div class="stat-lab">Avg Time</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--green)">${avgSpeed}</div><div class="stat-lab">Avg MPH</div></div>
      </div>
      <div class="total-mi">
        <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase">Total Miles Logged</div>
        <div style="font-size:18px;font-weight:800;color:var(--cyan);font-family:var(--mono)">${totalMi} mi</div>
      </div>`;
    }else if(rides.length>0){
      html+=`<div class="unlock-ban">Log ${3-rides.length} more ride${3-rides.length>1?"s":""} to unlock averages</div>`;
    }
    if(rides.length===0){
      html+=`<div class="empty"><div class="empty-ico">🚲</div><div class="empty-h">No rides logged yet</div></div>`;
    }else{
      rides.forEach(ride=>{
        html+=`<div class="prog-sess">
          <div class="prog-hd" style="background:#22d3ee11">
            <div>
              <div style="font-size:13px;font-weight:700">${fmtDate(ride.date)}</div>
              ${ride.note?`<div style="font-size:11px;color:var(--muted);font-style:italic">"${esc(ride.note)}"</div>`:""}
            </div>
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:800;color:var(--cyan);font-family:var(--mono)">${ride.distance}mi</div>
              <div style="font-size:11px;color:var(--muted)">${fmtDur(ride.duration)} · ${ride.speed}mph</div>
            </div>
          </div>
        </div>`;
      });
    }
  }
  el.innerHTML=html;
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll(){
  updateTheme();
  renderHeader();
  renderBackup();
  renderDayNav();
  renderTabBar();
  const tabs={today:"pane-today",hist:"pane-hist",prog:"pane-prog"};
  Object.entries(tabs).forEach(([k,id])=>{
    const el=document.getElementById(id);
    el.classList.toggle("on",state.tab===k);
  });
  if(state.tab==="today")renderToday();
  else if(state.tab==="hist")renderHistory();
  else if(state.tab==="prog")renderProgress();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init(){
  const h=dbGet(STORE),r=dbGet(RSTORE);
  if(h)state.history=h;
  if(r)state.routines={...DEFAULT_ROUTINES,...r};
  initDay(todayISO());
}
init();
</script>

</html>
